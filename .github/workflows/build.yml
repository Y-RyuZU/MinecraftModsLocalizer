name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release versions and tooling
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          python scripts/prepare-release.py --check-version ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
          python -m unittest discover -s scripts -p "test_*.py"

      - name: Run Bun tests
        run: bun run test

      - name: Run linting
        run: bun run lint
      
      - name: Run type checking
        run: bun run typecheck

      - name: Check UI translations
        run: bun run test:i18n

      - name: Run Vitest suites
        run: bun run test:vitest
      
      - name: Run tests
        run: bun run test:jest
      
      # - name: Setup tmate session (for debugging)
      #   if: failure() || github.event_name == 'workflow_dispatch'
      #   uses: mxschmitt/action-tmate@v3
      #   timeout-minutes: 3

  build:
    name: Build - ${{ matrix.platform.target }}
    needs: test
    # Pull requests run validation separately and do not receive the updater signing secret.
    if: github.event_name != 'pull_request'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}      # Repository Secret
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Remove bundles restored from an older release
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          bundles = (workspace / "src-tauri/target/${{ matrix.platform.target }}/release/bundle").resolve()
          bundles.relative_to(workspace / "src-tauri/target")
          if bundles.is_dir():
              shutil.rmtree(bundles)

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.platform.target }} --bundles ${{ matrix.platform.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mods-localizer-${{ matrix.platform.target }}
          path: src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    name: Validate Release Assets
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare signed updater manifest and checksums
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$(python scripts/prepare-release.py --check-version)"
          fi
          python scripts/prepare-release.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"

      - name: Upload validated release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: prepare-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Prepare download links
        run: python scripts/prepare-release.py --tag "${{ github.ref_name }}" --repository "${{ github.repository }}" --release-notes release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
            !release-assets/SHA256SUMS.txt
          body_path: release-notes.md
