name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Run linting
        run: bun run lint
      
      - name: Run type checking
        run: bun run typecheck
      
      - name: Run tests
        run: bun run test:jest
      
      # - name: Setup tmate session (for debugging)
      #   if: failure() || github.event_name == 'workflow_dispatch'
      #   uses: mxschmitt/action-tmate@v3
      #   timeout-minutes: 3

  build:
    name: Build - ${{ matrix.platform.target }}
    needs: test
    # Pull requests run validation separately and do not receive the updater signing secret.
    if: github.event_name != 'pull_request'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}      # Repository Secret
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          target: ${{ matrix.platform.target }}
          args: --bundles ${{ matrix.platform.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mods-localizer-${{ matrix.platform.target }}
          path: src-tauri/target/release/bundle/**/*
          retention-days: 7

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate signed updater manifest
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from shutil import copy2
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          root = Path("artifacts")
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          targets = {
              "windows-x86_64": ("x86_64-pc-windows-msvc", ".msi"),
              "darwin-x86_64": ("x86_64-apple-darwin", ".app.tar.gz"),
              "darwin-aarch64": ("aarch64-apple-darwin", ".app.tar.gz"),
              "linux-x86_64": ("x86_64-unknown-linux-gnu", ".AppImage"),
          }
          platforms = {}

          for platform, (target, suffix) in targets.items():
              artifact_dir = root / f"minecraft-mods-localizer-{target}"
              if not artifact_dir.is_dir():
                  raise SystemExit(f"Missing build artifact directory: {artifact_dir}")

              bundles = sorted(
                  path for path in artifact_dir.rglob("*")
                  if path.is_file() and path.name.endswith(suffix)
                  and not path.name.endswith(".sig")
              )
              if len(bundles) != 1:
                  raise SystemExit(f"Expected one {suffix} updater bundle for {target}, found: {bundles}")

              bundle = bundles[0]
              signature_file = Path(f"{bundle}.sig")
              if not signature_file.is_file():
                  raise SystemExit(f"Missing updater signature: {signature_file}")

              release_name = bundle.name.removesuffix(suffix) + f"-{target}" + suffix
              updater_dir = root / "updater-bundles"
              updater_dir.mkdir(exist_ok=True)
              release_bundle = updater_dir / release_name
              copy2(bundle, release_bundle)
              copy2(signature_file, Path(f"{release_bundle}.sig"))

              release_base = f"https://github.com/{repo}/releases/download/{quote(tag, safe='')}/"
              platforms[platform] = {
                  "url": release_base + quote(release_name, safe=""),
                  "signature": signature_file.read_text(encoding="utf-8").strip(),
              }

          manifest = {
              "version": version,
              "notes": f"Minecraft Mods Localizer {version}",
              "pub_date": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          Path("latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/updater-bundles/*
            latest.json
          body: |
            ## What's Changed
            
            <!-- Add your release notes here -->
            
            ## Installation
            
            ### Windows
            - Download the `.exe` or `.msi` installer for your system
            
            ### macOS
            - Download the `.dmg` file for your architecture (Intel or Apple Silicon)
            
            ### Linux
            - Download the `.AppImage` (universal) or `.deb` (Debian/Ubuntu) package
            
            ## Checksums
            
            <!-- Checksums will be automatically generated -->
