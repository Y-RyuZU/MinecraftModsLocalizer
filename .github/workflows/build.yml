name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Run linting
        run: bun run lint
      
      - name: Run type checking
        run: bun run typecheck
      
      - name: Run tests
        run: bun run test

      - name: Check version consistency
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          package = json.loads(pathlib.Path("package.json").read_text())
          tauri = json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text())
          cargo = pathlib.Path("src-tauri/Cargo.toml").read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.MULTILINE)
          versions = {package["version"], tauri["version"], match.group(1) if match else None}
          if len(versions) != 1 or None in versions:
              raise SystemExit(f"Version mismatch: package={package['version']}, tauri={tauri['version']}, cargo={match.group(1) if match else 'missing'}")
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/") and ref.removeprefix("refs/tags/") != f"v{tauri['version']}":
              raise SystemExit(f"Tag {ref} does not match app version {tauri['version']}")
          PY

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Check Rust build
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-features

  build:
    name: Build - ${{ matrix.platform.target }}
    needs: test
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}      # Repository Secret
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          target: ${{ matrix.platform.target }}
          args: --bundles ${{ matrix.platform.bundles }}

      - name: Disambiguate macOS updater bundle names
        if: startsWith(matrix.platform.target, 'x86_64-apple-') || startsWith(matrix.platform.target, 'aarch64-apple-')
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          arch = os.environ["TARGET"].split("-", 1)[0]
          folder = Path("src-tauri/target/release/bundle/macos")
          for bundle in folder.glob("*.app.tar.gz"):
              renamed = bundle.with_name(f"{bundle.name.removesuffix('.app.tar.gz')}_{arch}.app.tar.gz")
              signature = Path(f"{bundle}.sig")
              bundle.rename(renamed)
              if signature.exists():
                  signature.rename(Path(f"{renamed}.sig"))
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mods-localizer-${{ matrix.platform.target }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.tar.gz
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA-256 checksums
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          def hash_file(path):
              digest = sha256()
              with path.open("rb") as file:
                  for chunk in iter(lambda: file.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          extensions = {".AppImage", ".deb", ".dmg", ".exe", ".msi", ".gz", ".zip"}
          files = sorted(path for path in Path("artifacts").rglob("*") if path.is_file() and any(path.name.endswith(ext) for ext in extensions))
          names = [path.name for path in files]
          if not files or len(names) != len(set(names)):
              raise SystemExit("No release bundles found or duplicate asset names prevent portable checksums")

          lines = [f"{hash_file(path)}  {path.name}" for path in files]
          Path("artifacts/SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sig
            artifacts/SHA256SUMS
